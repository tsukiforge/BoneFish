name: CI (Release)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'
    
    - name: Initialize submodules
      run: git submodule update --init --recursive

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore BoneFish.sln

    - name: Build
      run: dotnet build BoneFish.sln -c Release --no-restore

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false .\Bloxstrap\Bloxstrap.csproj

    - name: Rename output
      run: ren .\Bloxstrap\bin\Release\net6.0-windows\win-x64\publish\Fishstrap.exe BoneFish.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BoneFish-Release
        path: .\Bloxstrap\bin\Release\net6.0-windows\win-x64\publish\BoneFish.exe
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: BoneFish-Release
          path: release

      - name: Rename binaries
        run: mv release/BoneFish.exe BoneFish.exe

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: BoneFish.exe
          name: BoneFish ${{ github.ref_name }}
          fail_on_unmatched_files: true

  release-test:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release-test')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: BoneFish-Release
          path: release

      - name: Rename binaries
        run: mv release/BoneFish.exe BoneFish.exe

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: BoneFish.exe
          name: BoneFish ${{ github.ref_name }}
          fail_on_unmatched_files: true

  auto-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Get version from csproj
        id: get_version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' Bloxstrap/Bloxstrap.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: BoneFish-Release
          path: release

      - name: Rename binaries
        run: mv release/BoneFish.exe BoneFish.exe

      - name: Create auto release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: BoneFish v${{ steps.get_version.outputs.version }}
          body: |
            Automatic release for BoneFish v${{ steps.get_version.outputs.version }}

            Built from commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: BoneFish.exe
          draft: false
          prerelease: false
